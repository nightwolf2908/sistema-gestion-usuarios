name: UserHub CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
jobs:
  python-syntax:
    name: Verificar sintaxis de Python
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar sintaxis del backend
        run: python -m compileall -q backend/app backend/alembic
